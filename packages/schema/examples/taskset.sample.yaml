schema_version: "1.0.0"
taskset_id: smoke
name_zh: 冒烟任务集
defaults:
  timeout_s: 180
  budget_cny: 0.5
  k: 3
  platform: codebuddy
  model: deepseek-v3
  team:
    size: 3
    roles: [lead, impl, review]
tasks:
  - task_id: t001
    prompt: "为 src/utils/date.ts 增加时区转换函数并补充单元测试"
    verdict:
      type: script
      run: "npm test -- --grep timezone"
      timeout_s: 120
      expect_exit_code: 0
    artifacts_expect: ["src/utils/date.ts"]
    labels:
      difficulty: easy
      category: greenfield
  - task_id: t002
    prompt: "修复 README.md 中损坏的示例命令，并验证其可执行"
    verdict:
      type: regex
      pattern: "^\\s*$"
      timeout_s: 60
    artifacts_expect: ["README.md"]
    labels:
      difficulty: easy
      category: docs
